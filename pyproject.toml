[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-android-runner"
version = "0.1.0"
description = "Self-contained ADB and vision-model runner with optional oracle verification."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
model-run = "android_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
