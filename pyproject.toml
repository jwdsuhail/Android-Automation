[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-android-runner"
dynamic = ["version"]
description = "Self-contained ADB and vision-model runner with optional oracle verification."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
console = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
model-run = "android_runner.cli:main"
model-console = "android_runner.console.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "android_runner.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
